<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Subvents Hub - vent</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header id="nav-container"></header>

        <main class="subvents-main">
            <div class="feed-header-actions">
                <h2>Explore Subvents</h2>
                <button id="makeSubventBtn" class="primary-btn">+ Make Subvent</button>
            </div>

            <div class="feed-controls" style="margin-bottom: 20px;">
                <input type="text" id="searchSubventInput" placeholder="Search subvents..." style="width: 100%;">
            </div>

            <div id="subventsContainer">
                <p>Loading subvents...</p>
            </div>
        </main>
    </div>

    <script type="module">
        import { db } from './firebase.js';
        import { collection, getDocs } from "https://www.gstatic.com/firebasejs/10.x.x/firebase-firestore.js";
        import { buildNav } from './vent.js';

        buildNav();

        let allSubvents = new Set(['general', 'gaming', 'tech']);

        document.getElementById('makeSubventBtn').addEventListener('click', () => {
            const subventName = prompt("Enter a name for the new subvent (e.g. books, art, fitness):");
            if (subventName) {
                const formatted = subventName.trim().toLowerCase().replace(/\s+/g, '-');
                if (formatted) {
                    window.location.href = `post.html?subvent=${formatted}`;
                }
            }
        });

        async function loadSubvents() {
            const container = document.getElementById('subventsContainer');
            try {
                const querySnapshot = await getDocs(collection(db, "posts"));
                querySnapshot.forEach((docSnap) => {
                    const data = docSnap.data();
                    if (data.subvent) {
                        allSubvents.add(data.subvent.trim().toLowerCase());
                    }
                });

                renderSubvents(Array.from(allSubvents));
            } catch (err) {
                console.error("Error loading subvents:", err);
                renderSubvents(Array.from(allSubvents));
            }
        }

        function renderSubvents(subventList) {
            const container = document.getElementById('subventsContainer');
            container.innerHTML = '';

            if (subventList.length === 0) {
                container.innerHTML = '<p>No subvents found matching your search.</p>';
                return;
            }

            const grid = document.createElement('div');
            grid.className = 'subvents-grid';

            subventList.forEach(subvent => {
                const card = document.createElement('div');
                card.className = 'subvent-card';
                
                card.innerHTML = `
                    <div>
                        <h3>#${subvent}</h3>
                        <p>Browse posts and join conversations in #${subvent}.</p>
                    </div>
                    <a href="feed.html?subvent=${subvent}" class="secondary-btn" style="text-align: center; text-decoration: none;">Visit Subvent</a>
                `;
                grid.appendChild(card);
            });

            container.appendChild(grid);
        }

        document.getElementById('searchSubventInput').addEventListener('input', (e) => {
            const term = e.target.value.toLowerCase();
            const filtered = Array.from(allSubvents).filter(s => s.includes(term));
            renderSubvents(filtered);
        });

        loadSubvents();
    </script>
</body>
</html>
