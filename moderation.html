<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Review — vent.</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">
  <header id="nav-container"></header>

  <h2 class="feed-heading">reported posts</h2>

  <div id="gate" class="empty-state">checking access...</div>

  <div id="modArea" style="display:none;">
    <div id="reportsList"></div>
  </div>
</div>

<script type="module">
  import {
    auth, db, onAuthStateChanged,
    collection, doc, getDoc, getDocs, query, where, deleteDoc, updateDoc
  } from './firebase.js';
  import { buildNav } from './vent.js';

  buildNav();

  const MODERATOR_USERNAMES = ['vent. Official Account', 'bigbackskyahh'];

  const gate = document.getElementById('gate');
  const modArea = document.getElementById('modArea');
  const reportsList = document.getElementById('reportsList');

  onAuthStateChanged(auth, async (user) => {
    if (!user){
      gate.textContent = "you need to be logged in to view this page.";
      return;
    }
    const userSnap = await getDoc(doc(db, 'users', user.uid));
    const username = userSnap.exists() ? userSnap.data().username : null;

    if (!MODERATOR_USERNAMES.includes(username)){
      gate.textContent = "this page is for moderators only.";
      return;
    }

    gate.style.display = 'none';
    modArea.style.display = 'block';
    loadReports();
  });

  async function loadReports(){
    reportsList.innerHTML = '<p class="empty-state">loading reports...</p>';

    const q = query(collection(db, 'posts'), where('reported', '==', true));
    const snap = await getDocs(q);

    if (snap.empty){
      reportsList.innerHTML = '<p class="empty-state">no reported posts right now. all clear.</p>';
      return;
    }

    reportsList.innerHTML = '';

    for (const postDoc of snap.docs){
      const post = postDoc.data();
      const postId = postDoc.id;

      let authorEmail = 'unknown';
      if (post.authorUid){
        try {
          const authorSnap = await getDoc(doc(db, 'users', post.authorUid));
          if (authorSnap.exists() && authorSnap.data().email){
            authorEmail = authorSnap.data().email;
          }
        } catch(err){ /* leave as unknown */ }
      }

      const card = document.createElement('div');
      card.className = 'post';

      const titleHtml = post.title ? `<div class="post-title">${escapeHtml(post.title)}</div>` : '';
      const dateStr = post.createdAt ? timeAgoSimple(post.createdAt) : '';

      card.innerHTML = `
        <div class="post-meta"><span>${escapeHtml(post.author || 'unknown')}</span><span>${dateStr}</span></div>
        ${titleHtml}
        <div class="post-body">${escapeHtml(post.text || '')}</div>
        <div class="post-reply">author email: ${escapeHtml(authorEmail)}</div>
        <div class="post-actions">
          <button class="dismiss-btn">dismiss report</button>
          <button class="delete-btn" data-delete>delete post</button>
        </div>
      `;

      card.querySelector('.dismiss-btn').addEventListener('click', async () => {
        if (confirm('clear this report? the post stays up.')){
          await updateDoc(doc(db, 'posts', postId), { reported: false });
          card.remove();
          checkEmpty();
        }
      });

      card.querySelector('.delete-btn').addEventListener('click', async () => {
        if (confirm('permanently delete this post?')){
          await deleteDoc(doc(db, 'posts', postId));
          card.remove();
          checkEmpty();
        }
      });

      reportsList.appendChild(card);
    }
  }

  function checkEmpty(){
    if (!reportsList.querySelector('.post')){
      reportsList.innerHTML = '<p class="empty-state">no reported posts right now. all clear.</p>';
    }
  }

  function timeAgoSimple(createdAt){
    const ms = Date.now() - createdAt;
    const hrs = Math.floor(ms / 3600000);
    if (hrs < 1) return 'just now';
    if (hrs < 24) return hrs + 'h ago';
    return Math.floor(hrs / 24) + 'd ago';
  }

  function escapeHtml(str){
    return String(str)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;");
  }
</script>
</body>
</html>
