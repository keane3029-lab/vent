<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>vent. — review</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">
  <div class="nav" id="nav"></div>

  <div class="feed-heading">reported posts</div>

  <div id="gate" class="empty-state">checking access...</div>
  <div id="reportsList"></div>

  <div class="feed-heading" style="margin-top:24px;">reported messages</div>
  <div id="messageReportsList"></div>

  <div class="footer-note">
    an idea for a place to vent — not a published product.
  </div>
</div>

<script src="vent.js"></script>
<script type="module">
  import {
    auth, db, onAuthStateChanged, signOut,
    collection, collectionGroup, doc, getDoc, getDocs, query, where, deleteDoc, updateDoc
  } from './firebase.js';

  const gate = document.getElementById('gate');
  const reportsList = document.getElementById('reportsList');
  const messageReportsList = document.getElementById('messageReportsList');

  onAuthStateChanged(auth, (user) => {
    if (!user){
      window.location.href = 'login.html';
      return;
    }
    const username = user.displayName || user.email;
    document.getElementById('nav').innerHTML = buildNavHtml(username, user.uid);
    const signOutBtn = document.getElementById('navSignOut');
    if (signOutBtn){
      signOutBtn.addEventListener('click', async () => {
        await signOut(auth);
        window.location.href = 'index.html';
      });
    }

    if (!MODERATOR_UIDS.includes(user.uid)){
      gate.textContent = "this page is for moderators only.";
      return;
    }

    gate.style.display = 'none';
    loadReports();
    loadMessageReports();
  });

  async function loadReports(){
    reportsList.innerHTML = '<p class="empty-state">loading reports...</p>';

    const q = query(collection(db, 'posts'), where('reported', '==', true));
    const snap = await getDocs(q);

    if (snap.empty){
      reportsList.innerHTML = '<p class="empty-state">no reported posts right now. all clear.</p>';
      return;
    }

    reportsList.innerHTML = '';

    for (const postDoc of snap.docs){
      const post = postDoc.data();
      const postId = postDoc.id;

      let authorEmail = 'unknown';
      if (post.authorUid){
        try {
          const authorSnap = await getDoc(doc(db, 'users', post.authorUid));
          if (authorSnap.exists() && authorSnap.data().email){
            authorEmail = authorSnap.data().email;
          }
        } catch(err){ /* leave as unknown */ }
      }

      const card = document.createElement('div');
      card.className = 'post';

      const titleHtml = post.title ? `<div class="post-title">${escapeHtml(post.title)}</div>` : '';

      card.innerHTML = `
        <div class="post-meta"><span>${escapeHtml(post.author || 'unknown')}</span><span>${timeAgo(post.createdAt)}</span></div>
        ${titleHtml}
        <div class="post-body">${escapeHtml(post.text || '')}</div>
        <div class="post-reply">author email: ${escapeHtml(authorEmail)}</div>
        <div class="post-actions">
          <button class="dismiss-btn">dismiss report</button>
          <button class="delete-btn" data-delete>delete post</button>
        </div>
      `;

      card.querySelector('.dismiss-btn').addEventListener('click', async () => {
        if (confirm('clear this report? the post stays up.')){
          await updateDoc(doc(db, 'posts', postId), { reported: false });
          card.remove();
          checkEmpty();
        }
      });

      card.querySelector('.delete-btn').addEventListener('click', async () => {
        if (confirm('permanently delete this post?')){
          await deleteDoc(doc(db, 'posts', postId));
          card.remove();
          checkEmpty();
        }
      });

      reportsList.appendChild(card);
    }
  }

  function checkEmpty(){
    if (!reportsList.querySelector('.post')){
      reportsList.innerHTML = '<p class="empty-state">no reported posts right now. all clear.</p>';
    }
  }

  async function loadMessageReports(){
    messageReportsList.innerHTML = '<p class="empty-state">loading reports...</p>';

    const q = query(collectionGroup(db, 'messages'), where('reported', '==', true));
    let snap;
    try {
      snap = await getDocs(q);
    } catch (err){
      // collection-group queries need a Firestore index the first time they're run —
      // the console will offer a one-click link to create it if this fails
      messageReportsList.innerHTML = '<p class="empty-state">couldn\'t load message reports — a Firestore index may still need to be created (check the browser console for a link).</p>';
      console.error(err);
      return;
    }

    if (snap.empty){
      messageReportsList.innerHTML = '<p class="empty-state">no reported messages right now. all clear.</p>';
      return;
    }

    messageReportsList.innerHTML = '';

    for (const msgDoc of snap.docs){
      const m = msgDoc.data();
      const chatId = msgDoc.ref.parent.parent.id;

      let senderEmail = 'unknown';
      if (m.senderUid){
        try {
          const senderSnap = await getDoc(doc(db, 'users', m.senderUid));
          if (senderSnap.exists() && senderSnap.data().email) senderEmail = senderSnap.data().email;
        } catch(err){ /* leave as unknown */ }
      }

      const card = document.createElement('div');
      card.className = 'post';
      card.innerHTML = `
        <div class="post-meta"><span>${escapeHtml(m.senderName || 'unknown')}</span><span>${timeAgo(m.createdAt)}</span></div>
        <div class="post-body">${escapeHtml(m.text || '')}</div>
        <div class="post-reply">chat: ${escapeHtml(chatId)} · sender email: ${escapeHtml(senderEmail)}</div>
        <div class="post-actions">
          <button class="dismiss-btn">dismiss report</button>
          <button class="delete-btn" data-delete>delete message</button>
        </div>
      `;

      card.querySelector('.dismiss-btn').addEventListener('click', async () => {
        if (confirm('clear this report? the message stays up.')){
          await updateDoc(msgDoc.ref, { reported: false });
          card.remove();
          checkMessagesEmpty();
        }
      });

      card.querySelector('.delete-btn').addEventListener('click', async () => {
        if (confirm('permanently delete this message?')){
          await deleteDoc(msgDoc.ref);
          card.remove();
          checkMessagesEmpty();
        }
      });

      messageReportsList.appendChild(card);
    }
  }

  function checkMessagesEmpty(){
    if (!messageReportsList.querySelector('.post')){
      messageReportsList.innerHTML = '<p class="empty-state">no reported messages right now. all clear.</p>';
    }
  }
</script>
</body>
</html>
