<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Post - vent</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header id="nav-container"></header>
        
        <main class="composer-container">
            <h2>Create a Post</h2>
            <form id="postForm">
                <div class="input-group">
                    <label for="subventInput">Subvent (e.g. general, gaming, tech)</label>
                    <input type="text" id="subventInput" placeholder="general" value="general">
                </div>
                
                <div class="input-group">
                    <label for="postText">What's on your mind?</label>
                    <textarea id="postText" rows="5" placeholder="Vent here..." required></textarea>
                </div>

                <div class="input-group">
                    <label for="postImage">Attach Photo (optional)</label>
                    <input type="file" id="postImage" accept="image/*">
                </div>

                <div id="imagePreviewContainer" style="display:none;">
                    <img id="imagePreview" alt="Preview" style="max-width: 100%; max-height: 200px; border-radius: 8px;">
                    <button type="button" id="removeImageBtn" class="secondary-btn">Remove Photo</button>
                </div>

                <p id="errorMsg" class="error-text" style="display:none;"></p>
                
                <button type="submit" class="primary-btn">Post</button>
            </form>
        </main>
    </div>

    <script type="module">
        import { db, auth } from './firebase.js';
        import { collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.x.x/firebase-firestore.js";
        import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.x.x/firebase-auth.js";
        import { checkExplicit, checkBullying, checkSelfHarm, compressImage, buildNav, getQueryParam } from './vent.js';

        buildNav();

        let currentUser = null;
        let compressedImageUrl = null;

        // Auto-select subvent if passed in URL query parameters (e.g. post.html?subvent=books)
        const urlSubvent = getQueryParam('subvent');
        if (urlSubvent) {
            document.getElementById('subventInput').value = urlSubvent;
        }

        onAuthStateChanged(auth, async (user) => {
            if (!user) {
                window.location.href = 'login.html';
                return;
            }
            const { doc, getDoc } = await import("https://www.gstatic.com/firebasejs/10.x.x/firebase-firestore.js");
            const userSnap = await getDoc(doc(db, "users", user.uid));
            if (userSnap.exists()) {
                currentUser = { uid: user.uid, ...userSnap.data() };
            }
        });

        document.getElementById('postImage').addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (file) {
                try {
                    compressedImageUrl = await compressImage(file, 700);
                    document.getElementById('imagePreview').src = compressedImageUrl;
                    document.getElementById('imagePreviewContainer').style.display = 'block';
                } catch (err) {
                    console.error("Image compression failed", err);
                }
            }
        });

        document.getElementById('removeImageBtn').addEventListener('click', () => {
            compressedImageUrl = null;
            document.getElementById('postImage').value = '';
            document.getElementById('imagePreviewContainer').style.display = 'none';
        });

        document.getElementById('postForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            if (!currentUser) return;

            const text = document.getElementById('postText').value.trim();
            const subventVal = document.getElementById('subventInput').value.trim().toLowerCase() || 'general';
            const errorMsg = document.getElementById('errorMsg');
            errorMsg.style.display = 'none';

            if (checkExplicit(text)) {
                errorMsg.textContent = "Your post contains prohibited language.";
                errorMsg.style.display = 'block';
                return;
            }

            const isBullying = checkBullying(text);
            const selfHarmDetected = checkSelfHarm(text);

            if (selfHarmDetected) {
                alert("We noticed you might be going through a difficult time. Please know that support is available: Call or text 988 anytime.");
            }

            try {
                await addDoc(collection(db, "posts"), {
                    author: currentUser.username,
                    authorUid: currentUser.uid,
                    text: text,
                    subvent: subventVal,
                    imageUrl: compressedImageUrl || null,
                    createdAt: serverTimestamp(),
                    flaggedBullying: isBullying,
                    reported: false
                });

                window.location.href = `feed.html?subvent=${subventVal}`;
            } catch (err) {
                console.error("Error writing post: ", err);
                errorMsg.textContent = "Failed to publish post. Try again.";
                errorMsg.style.display = 'block';
            }
        });
    </script>
</body>
</html>
