<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feed - vent</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header id="nav-container"></header>

        <main class="feed-main">
            <div class="feed-header-actions" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; flex-wrap: wrap; gap: 10px;">
                <h2 id="feedTitle">Global Feed</h2>
                <div style="display: flex; gap: 8px;">
                    <button id="makeSubventBtn" class="secondary-btn" style="padding: 6px 14px;">+ Make Subvent</button>
                    <a href="post.html" class="primary-btn" style="text-decoration: none; padding: 6px 14px; display: inline-flex; align-items: center;">+ New Post</a>
                </div>
            </div>

            <!-- Search and Subvent Controls -->
            <div class="feed-controls" style="margin-bottom: 20px; display: flex; gap: 10px; flex-wrap: wrap;">
                <input type="text" id="searchInput" placeholder="Search posts..." style="flex: 1; min-width: 200px; padding: 8px; border-radius: 6px; border: 1px solid #ccc;">
                <select id="subventFilter" style="padding: 8px; border-radius: 6px; border: 1px solid #ccc;">
                    <option value="">All Subvents</option>
                    <option value="general">general</option>
                    <option value="gaming">gaming</option>
                    <option value="tech">tech</option>
                </select>
            </div>

            <div id="postsContainer">
                <p>Loading posts...</p>
            </div>
        </main>
    </div>

    <script type="module">
        import { db, auth } from './firebase.js';
        import { collection, query, orderBy, getDocs, where, doc, getDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.x.x/firebase-firestore.js";
        import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.x.x/firebase-auth.js";
        import { buildNav, getQueryParam } from './vent.js';

        buildNav();

        let currentAuthUser = null;
        let currentUsername = null;

        onAuthStateChanged(auth, async (user) => {
            currentAuthUser = user;
            if (user) {
                const userSnap = await getDoc(doc(db, "users", user.uid));
                if (userSnap.exists()) {
                    currentUsername = userSnap.data().username;
                }
            }
            loadPosts();
        });

        const activeSubvent = getQueryParam('subvent');
        if (activeSubvent) {
            document.getElementById('feedTitle').textContent = `Subvent: #${activeSubvent}`;
            const subventDropdown = document.getElementById('subventFilter');
            subventDropdown.value = activeSubvent;
        }

        document.getElementById('subventFilter').addEventListener('change', (e) => {
            const val = e.target.value;
            if (val) {
                window.location.href = `feed.html?subvent=${val}`;
            } else {
                window.location.href = `feed.html`;
            }
        });

        document.getElementById('makeSubventBtn').addEventListener('click', () => {
            const subventName = prompt("Enter a name for the new subvent (e.g. books, art, fitness):");
            if (subventName) {
                const formatted = subventName.trim().toLowerCase().replace(/\s+/g, '-');
                if (formatted) {
                    window.location.href = `post.html?subvent=${formatted}`;
                }
            }
        });

        document.getElementById('searchInput').addEventListener('input', (e) => {
            const term = e.target.value.toLowerCase();
            const postCards = document.querySelectorAll('.post-card');
            postCards.forEach(card => {
                const content = card.innerText.toLowerCase();
                card.style.display = content.includes(term) ? 'block' : 'none';
            });
        });

        async function loadPosts() {
            const container = document.getElementById('postsContainer');
            container.innerHTML = '';

            try {
                let postsQuery;
                if (activeSubvent) {
                    postsQuery = query(collection(db, "posts"), where("subvent", "==", activeSubvent), orderBy("createdAt", "desc"));
                } else {
                    postsQuery = query(collection(db, "posts"), orderBy("createdAt", "desc"));
                }

                const querySnapshot = await getDocs(postsQuery);

                if (querySnapshot.empty) {
                    container.innerHTML = `<p>No posts found in #${activeSubvent || 'general'} yet. Be the first to post!</p>`;
                    return;
                }

                querySnapshot.forEach((postDoc) => {
                    const post = postDoc.data();
                    const postId = postDoc.id;

                    const card = document.createElement('div');
                    card.className = 'post-card';
                    card.style.cssText = "background: #fff; border: 1px solid #ddd; padding: 15px; border-radius: 8px; margin-bottom: 15px;";

                    const subventTag = `<a href="feed.html?subvent=${post.subvent || 'general'}" style="background: #eee; color: #333; padding: 2px 6px; border-radius: 4px; font-size: 0.8rem; font-weight: bold; text-decoration: none;">#${post.subvent || 'general'}</a>`;
                    const dateStr = post.createdAt ? new Date(post.createdAt.seconds * 1000).toLocaleString() : 'Just now';

                    let htmlContent = `
                        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
                            <strong>@${post.author}</strong>
                            <div>
                                ${subventTag}
                                <span style="font-size: 0.8rem; color: #666; margin-left: 8px;">${dateStr}</span>
                            </div>
                        </div>
                        <p style="white-space: pre-wrap; word-break: break-word;">${escapeHtml(post.text)}</p>
                    `;

                    if (post.flaggedBullying) {
                        htmlContent += `<div style="background: #fff3f3; color: #d00; padding: 6px; font-size: 0.85rem; margin-top: 8px; border-radius: 4px;">Automated note: Please keep comments supportive and avoid targeted hostility.</div>`;
                    }

                    if (post.imageUrl) {
                        htmlContent += `<div style="margin-top: 10px;"><img src="${post.imageUrl}" style="max-width: 100%; border-radius: 6px;" /></div>`;
                    }

                    const canDelete = currentAuthUser && (post.authorUid === currentAuthUser.uid || (!post.authorUid && currentUsername === post.author));
                    if (canDelete) {
                        htmlContent += `<div style="margin-top: 10px; text-align: right;"><button class="delete-btn secondary-btn" data-id="${postId}" style="font-size: 0.8rem; padding: 3px 8px; color: #d00; border-color: #d00;">Delete</button></div>`;
                    }

                    card.innerHTML = htmlContent;

                    const delBtn = card.querySelector('.delete-btn');
                    if (delBtn) {
                        delBtn.addEventListener('click', async () => {
                            if (confirm("Are you sure you want to delete this post?")) {
                                try {
                                    await deleteDoc(doc(db, "posts", postId));
                                    card.remove();
                                } catch (err) {
                                    console.error("Error deleting post:", err);
                                    alert("Could not delete post.");
                                }
                            }
                        });
                    }

                    container.appendChild(card);
                });

            } catch (err) {
                console.error("Error loading posts:", err);
                container.innerHTML = '<p>Error loading feed. If this is a missing index error, check your browser console for the Firestore link to auto-create it.</p>';
            }
        }

        function escapeHtml(str) {
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }
    </script>
</body>
</html>
